name: E2E Tests

# Pull requests only — never on push/merge. The suite boots a full stack
# (Postgres, API, MailPit, SeaweedFS, Vite) and is the pre-merge gate, so
# re-running it on main would only repeat what the PR already proved.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_ref:
        description: 'API branch or ref to test against (defaults to main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    # GitHub-hosted, not self-hosted: every run gets a clean disk, which is
    # what the image builds below need.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Same stack developers run locally, plus the CI-only overrides.
      COMPOSE_FILE: docker-compose.test.yml:docker-compose.actions.yml
      COMPOSE_PROFILES: e2e
      # A hosted runner has 4 vCPUs shared with the dev server, API and
      # Postgres; the config default of 4 workers oversubscribes it.
      PLAYWRIGHT_WORKERS: '2'

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      # The API image is built from source. actions/checkout cannot write
      # outside GITHUB_WORKSPACE, so it lands here instead of the sibling
      # ../ninerlog-api used locally; docker-compose.actions.yml repoints the
      # build context to match. The repo is public, so the default token works
      # where PROJECT_REPO_TOKEN is unavailable (e.g. a fork PR).
      - name: Checkout API (for docker build)
        uses: actions/checkout@v7
        with:
          repository: fjaeckel/ninerlog-api
          token: ${{ secrets.PROJECT_REPO_TOKEN || github.token }}
          path: ./ninerlog-api
          ref: ${{ inputs.api_ref || 'main' }}

      # The Playwright, Node and Go images together are a few GB; the
      # preinstalled toolchains are not used by this job.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Build images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1

      # --wait blocks until both healthchecks pass, so a broken API or dev
      # server fails here with its own logs instead of as a wall of Playwright
      # timeouts. Postgres, MailPit, SeaweedFS and the bucket-init job come
      # along via depends_on.
      - name: Start API + frontend dev server
        run: docker compose up -d --wait api-test frontend-dev

      # Playwright runs inside the compose network, where the app is served on
      # https://app.ninerlog.test:5173 and MailPit on mailpit-test:8025 — the
      # hostnames the API's WebAuthn RP ID and mail links are configured for.
      - name: Run E2E tests
        run: docker compose run --rm frontend-e2e

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7
